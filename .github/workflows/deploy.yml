name: CI/CD — Test and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Run Tests ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: stockms_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql, redis, zip, intl, gd, bcmath

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy environment file
        run: cp .env.example .env

      - name: Set test environment
        run: |
          echo "APP_KEY=" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_DATABASE=stockms_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=secret" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Check routes load correctly
        run: php artisan route:list

      - name: Run tests
        run: php artisan test --stop-on-failure

  # ── Job 2: Deploy (only after tests pass on main) ─────────────────
  deploy:
    name: Deploy to A2 Hosting
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.A2_HOST }}
          username: ${{ secrets.A2_USER }}
          key: ${{ secrets.A2_PRIVATE_KEY }}
          port: ${{ secrets.A2_PORT }}
          script: |
            set -e
            cd ~/stockms_app

            echo "── Current version before deploy ──"
            git log -1 --oneline

            echo "── Pulling latest code ──"
            git fetch origin main
            git reset --hard origin/main

            echo "── New version after deploy ──"
            git log -1 --oneline

            echo "── Installing dependencies ──"
            /opt/cpanel/composer/bin/composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction

            echo "── Clearing ghost caches ──"
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/services.php
            rm -f bootstrap/cache/packages.php
            rm -f bootstrap/cache/routes-v7.php

            echo "── Running migrations ──"
            php artisan migrate --force

            echo "── Optimizing ──"
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:cache-components

            echo "── Fixing permissions ──"
            chmod -R 775 storage bootstrap/cache

            echo "✅ Deployment complete at $(date)"