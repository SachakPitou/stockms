name: Deploy to A2 Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to A2 Hosting
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.A2_HOST }}
          username: ${{ secrets.A2_USER }}
          key: ${{ secrets.A2_PRIVATE_KEY }}
          port: ${{ secrets.A2_PORT }}
          script: |
            set -e
            cd ~/stockms_app

            echo "── Before pull ──"
            git log -1 --oneline

            # Force sync to latest main
            git fetch origin main
            git reset --hard origin/main

            echo "── After pull ──"
            git log -1 --oneline

            # Install dependencies
            /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction

            # Clear ghost caches
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/services.php
            rm -f bootstrap/cache/packages.php
            rm -f bootstrap/cache/routes-v7.php

            # Run migrations and optimize
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan filament:cache-components

            # Fix permissions
            chmod -R 775 storage bootstrap/cache

            echo "✅ Deployment complete at $(date)"