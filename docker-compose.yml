version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockms_app
    restart: unless-stopped
    working_dir: /var/www
    user: "1000:1000"  
    volumes:
      - .:/var/www
    networks:
      - stockms

  nginx:
    image: nginx:1.25-alpine
    container_name: stockms_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - stockms

  db:
    image: mysql:8.0
    container_name: stockms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - stockms

  redis:
    image: redis:7-alpine
    container_name: stockms_redis
    restart: unless-stopped
    networks:
      - stockms

networks:
  stockms:
    driver: bridge

volumes:
  dbdata: